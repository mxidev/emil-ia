<section class="chat">
  <div class="welcome" *ngIf="state.messages().length === 0">
    <div class="hero">¿Qué quieres entender hoy?</div>
    <p>
      Pregunta sobre matemáticas, ingeniería o programación. El sistema elegirá
      la estrategia adecuada y mostrará el razonamiento con Markdown y LaTeX.
    </p>
    <div class="suggestions">
      <button
        type="button"
        (click)="
          useSuggestion(
            'Demuestra que la suma de dos funciones continuas es continua'
          )
        "
      >
        Demostración matemática
      </button>
      <button
        type="button"
        (click)="
          useSuggestion('Resuelve este sistema de ecuaciones paso a paso')
        "
      >
        Resolver un ejercicio
      </button>
      <button
        type="button"
        (click)="useSuggestion('Explica qué es un autovalor')"
      >
        Explicación conceptual
      </button>
    </div>
  </div>

  <article
    *ngFor="let message of state.messages()"
    [class.user]="message.role === 'user'"
    [class.assistant]="message.role === 'assistant'"
  >
    <span class="role">{{ message.role === "user" ? "Tú" : "Emil-IA" }}</span>
    <div class="content" [innerHTML]="render(message.content)"></div>
  </article>

  <div class="typing" *ngIf="state.loading()">Pensando…</div>
  <div
    class="feedback"
    *ngIf="
      state.conversationId() &&
      !state.loading() &&
      state.messages().length > 1 &&
      !state.feedbackSent()
    "
  >
    <span>¿Te sirvió esta conversación?</span>
    <button type="button" (click)="state.sendFeedback('positive')">Sí</button>
    <button
      type="button"
      (click)="state.sendFeedback('negative', 'resultado incorrecto')"
    >
      No
    </button>
  </div>
</section>

<form class="composer" (submit)="$event.preventDefault(); state.send()">
  <div class="attachment-panel">
    <label class="attachment-button" for="pdf-upload">
      Adjuntar PDF
      <input
        id="pdf-upload"
        type="file"
        accept="application/pdf,.pdf"
        (change)="onFileSelected($event)"
      />
    </label>
    <div class="attachment-list" *ngIf="state.attachments().length > 0">
      <button
        class="attachment-chip"
        *ngFor="let attachment of state.attachments()"
        type="button"
        [class.selected]="state.selectedAttachmentIds().includes(attachment.id)"
        [class.failed]="attachment.status === 'failed'"
        [attr.aria-pressed]="state.selectedAttachmentIds().includes(attachment.id)"
        [disabled]="attachment.status === 'failed'"
        (click)="state.toggleAttachmentSelection(attachment.id)"
      >
        <span>{{ attachment.filename }}</span>
        <small>{{ attachment.status === "ready" ? "Incluido" : "Sin texto" }}</small>
      </button>
    </div>
  </div>
  <textarea
    aria-label="Escribe tu consulta"
    [value]="state.draft()"
    (input)="state.draft.set($any($event.target).value)"
    (keydown.enter)="onEnter($event)"
    placeholder="Escribe tu consulta…"
    rows="1"
  ></textarea>
  <button type="submit" [disabled]="state.loading() || !state.draft().trim()">
    Enviar <span>↵</span>
  </button>
</form>
