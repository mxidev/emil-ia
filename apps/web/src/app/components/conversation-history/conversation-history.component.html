<nav class="history" aria-label="Conversaciones">
  <div class="heading">
    <span>Conversaciones</span>
    <button
      class="new-conversation"
      type="button"
      (click)="state.startNewConversation()"
    >
      + Nueva
    </button>
  </div>
  <div class="conversation-list">
    <p class="empty-history" *ngIf="state.conversations().length === 0">
      Aquí aparecerán tus conversaciones.
    </p>
    <button
      type="button"
      class="conversation"
      *ngFor="let conversation of state.conversations()"
      [class.selected]="conversation.id === state.conversationId()"
      [attr.aria-current]="
        conversation.id === state.conversationId() ? 'page' : null
      "
      (click)="state.selectConversation(conversation.id)"
      [title]="conversation.title"
    >
      {{ conversation.title }}
    </button>
  </div>
  <div class="actions" aria-label="Exportar conversación">
    <button
      type="button"
      [disabled]="!state.conversationId()"
      (click)="state.exportConversation('md')"
      aria-label="Exportar conversación en Markdown"
      title="Exportar conversación en Markdown"
    >
      <span class="file-icon file-icon-md" aria-hidden="true">MD</span>
      <span>Markdown</span>
    </button>
    <button
      type="button"
      [disabled]="!state.conversationId()"
      (click)="state.exportConversation('pdf')"
      aria-label="Exportar conversación en PDF"
      title="Exportar conversación en PDF"
    >
      <span class="file-icon file-icon-pdf" aria-hidden="true">PDF</span>
      <span>PDF</span>
    </button>
  </div>
</nav>
