<nav class="history" aria-label="Conversaciones">
  <div class="heading">
    <span>Conversaciones</span>
    <button
      class="new-conversation"
      type="button"
      (click)="state.startNewConversation()"
    >
      + Nueva
    </button>
  </div>
  <div class="conversation-list">
    <p class="empty-history" *ngIf="state.conversations().length === 0">
      Aquí aparecerán tus conversaciones.
    </p>
    <button
      type="button"
      class="conversation"
      *ngFor="let conversation of state.conversations()"
      [class.selected]="conversation.id === state.conversationId()"
      [attr.aria-current]="
        conversation.id === state.conversationId() ? 'page' : null
      "
      (click)="state.selectConversation(conversation.id)"
      [title]="conversation.title"
    >
      {{ conversation.title }}
    </button>
  </div>
  <div class="actions" aria-label="Exportar conversación">
    <button
      type="button"
      [disabled]="!state.conversationId()"
      (click)="state.exportConversation('md')"
      aria-label="Exportar conversación en Markdown"
      title="Exportar conversación en Markdown"
    >
      <svg class="file-icon file-icon-md" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-filetype-md" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M14 4.5V14a2 2 0 0 1-2 2H9v-1h3a1 1 0 0 0 1-1V4.5h-2A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v9H2V2a2 2 0 0 1 2-2h5.5zM.706 13.189v2.66H0V11.85h.806l1.14 2.596h.026l1.14-2.596h.8v3.999h-.716v-2.66h-.038l-.946 2.159h-.516l-.952-2.16H.706Zm3.919 2.66V11.85h1.459q.609 0 1.005.234t.589.68q.195.445.196 1.075 0 .634-.196 1.084-.197.451-.595.689-.396.237-1 .237H4.626Zm1.353-3.354h-.562v2.707h.562q.279 0 .484-.082a.8.8 0 0 0 .334-.252 1.1 1.1 0 0 0 .196-.422q.067-.252.067-.592a2.1 2.1 0 0 0-.117-.753.9.9 0 0 0-.354-.454q-.238-.152-.61-.152"/>
      </svg>
      <span>Markdown</span>
    </button>
    <button
      type="button"
      [disabled]="!state.conversationId()"
      (click)="state.exportConversation('pdf')"
      aria-label="Exportar conversación en PDF"
      title="Exportar conversación en PDF"
    >
      <svg class="file-icon file-icon-pdf" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-filetype-pdf" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M14 4.5V14a2 2 0 0 1-2 2h-1v-1h1a1 1 0 0 0 1-1V4.5h-2A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v9H2V2a2 2 0 0 1 2-2h5.5zM1.6 11.85H0v3.999h.791v-1.342h.803q.43 0 .732-.173.305-.175.463-.474a1.4 1.4 0 0 0 .161-.677q0-.375-.158-.677a1.2 1.2 0 0 0-.46-.477q-.3-.18-.732-.179m.545 1.333a.8.8 0 0 1-.085.38.57.57 0 0 1-.238.241.8.8 0 0 1-.375.082H.788V12.48h.66q.327 0 .512.181.185.183.185.522m1.217-1.333v3.999h1.46q.602 0 .998-.237a1.45 1.45 0 0 0 .595-.689q.196-.45.196-1.084 0-.63-.196-1.075a1.43 1.43 0 0 0-.589-.68q-.396-.234-1.005-.234zm.791.645h.563q.371 0 .609.152a.9.9 0 0 1 .354.454q.118.302.118.753a2.3 2.3 0 0 1-.068.592 1.1 1.1 0 0 1-.196.422.8.8 0 0 1-.334.252 1.3 1.3 0 0 1-.483.082h-.563zm3.743 1.763v1.591h-.79V11.85h2.548v.653H7.896v1.117h1.606v.638z"/>
      </svg>
      <span>PDF</span>
    </button>
  </div>
</nav>
